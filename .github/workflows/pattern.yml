name: Publish Pattern TOMLs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: pattern
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  pattern:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # default persist-credentials: Publish pushes via the built-in token.

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Fetch client binaries
        id: fetch
        run: |
          sha_of() { sha256sum "$1" | cut -d' ' -f1; }
          PUBLISHED=$(ls pattern/steamui/*.toml 2>/dev/null | xargs -r -n1 basename -s .toml | sort -u | tr '\n' ' ')
          for f in pattern/steamclient/*.toml; do
            [ -e "$f" ] || continue
            sha=$(basename -s .toml "$f")
            # A steamclient build counts as published only with its IPC file:
            # otherwise the old 24-entry set would mask the missing ipc/ TOML
            # and fetch would keep reporting "already published".
            if [ -f "ipc/steamclient/$sha.toml" ]; then
              PUBLISHED="$PUBLISHED $sha"
            fi
          done
          set +e
          python3 tools/fetch_client.py --out bins/ --channels stable beta --published-shas $PUBLISHED --versions-file pattern/versions.json
          CODE=$?
          set -e
          # exit 2 = all SHAs published: versions.json is still updated, but
          # downstream skips because no new TOML is needed.
          if [ "$CODE" -eq 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi
          CHANNELS=""
          for channel in stable beta; do
            if [ -f "bins/$channel/steamclient64.dll" ]; then
              CHANNELS="$CHANNELS $channel"
              echo "sha_sc_$channel=$(sha_of bins/$channel/steamclient64.dll)" >> "$GITHUB_OUTPUT"
              echo "sha_sui_$channel=$(sha_of bins/$channel/SteamUI.dll)" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"

      - name: Resolve patterns
        id: pattern
        if: steps.fetch.outputs.skip != 'true'
        run: |
          : > skips_pattern.txt
          CODE_ALL=0
          for channel in $STEPS_FETCH_OUTPUTS_CHANNELS; do
            set +e
            python3 tools/resolve_patterns.py resolve \
              --dll "bins/$channel/steamclient64.dll" --side steamclient \
              --out-dir pattern/ > "resolve_sc_$channel.log" 2>&1
            CODE_SC=$?
            python3 tools/resolve_patterns.py resolve \
              --dll "bins/$channel/SteamUI.dll" --side steamui \
              --out-dir pattern/ > "resolve_sui_$channel.log" 2>&1
            CODE_SUI=$?
            set -e
            cat "resolve_sc_$channel.log" "resolve_sui_$channel.log"
            grep -E '^FAIL ' "resolve_sc_$channel.log" "resolve_sui_$channel.log" >> skips_pattern.txt || true
            if [ "$CODE_SC" -ne 0 ] || [ "$CODE_SUI" -ne 0 ]; then
              CODE_ALL=1
            fi
          done
          echo "code=$CODE_ALL" >> "$GITHUB_OUTPUT"
        env:
          STEPS_FETCH_OUTPUTS_CHANNELS: ${{ steps.fetch.outputs.channels }}

      - name: Resolve IPC
        id: ipc
        if: steps.fetch.outputs.skip != 'true'
        run: |
          : > skips_ipc.txt
          CODE_ALL=0
          for channel in $STEPS_FETCH_OUTPUTS_CHANNELS; do
            set +e
            # funcHash / fencepost are read out of the wrapper body on every
            # build, so one binary resolves the same whichever channel it
            # arrived on - the channel no longer selects a constant table.
            python3 tools/resolve_ipc.py resolve \
              --dll "bins/$channel/steamclient64.dll" --channel "$channel" \
              --out-dir ipc/ > "resolve_ipc_$channel.log" 2>&1
            CODE_IPC=$?
            set -e
            cat "resolve_ipc_$channel.log"
            grep -E '^FAIL ' "resolve_ipc_$channel.log" >> skips_ipc.txt || true
            if [ "$CODE_IPC" -ne 0 ]; then
              CODE_ALL=1
            fi
          done
          echo "code=$CODE_ALL" >> "$GITHUB_OUTPUT"
        env:
          STEPS_FETCH_OUTPUTS_CHANNELS: ${{ steps.fetch.outputs.channels }}

      - name: Publish
        # Either resolver that succeeded still publishes: a blocked IPC feed
        # must not hold back pattern hooks, and the other way round. This is
        # only skipped when both sides failed and nothing was written.
        if: |
          steps.fetch.outputs.skip != 'true' &&
          (steps.pattern.outputs.code == '0' || steps.ipc.outputs.code == '0')
        env:
          # README timestamps render in runner-local time; pin UTC.
          TZ: UTC
        run: |
          python3 -c "import json; print(json.dumps({'versions': json.load(open('pattern/versions.json'))}))" > /tmp/readme_data.json
          npx -y knap@0.4.2 render templates/readme.md \
            --data /tmp/readme_data.json --output README.md
          ver() { python3 -c "import json; print(json.load(open('bins/$1/versions.json'))['version'])" 2>/dev/null || echo skipped; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern/ ipc/ README.md
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "Update Steam rule patterns (stable $(ver stable), beta $(ver beta))"
          git push

      - name: Report blocked resolvers
        # A repeat failure appends a comment instead of stopping at "already
        # open". That early exit is why a frozen feed stayed green for a week.
        if: |
          steps.fetch.outputs.skip != 'true' &&
          (steps.pattern.outputs.code != '0' || steps.ipc.outputs.code != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_SC: ${{ steps.fetch.outputs.sha_sc_stable }}
          STABLE_SUI: ${{ steps.fetch.outputs.sha_sui_stable }}
          BETA_SC: ${{ steps.fetch.outputs.sha_sc_beta }}
          BETA_SUI: ${{ steps.fetch.outputs.sha_sui_beta }}
          PATTERN_CODE: ${{ steps.pattern.outputs.code }}
          IPC_CODE: ${{ steps.ipc.outputs.code }}
        run: |
          for side in pattern ipc; do
            case "$side" in
              pattern) code="$PATTERN_CODE"; skipfile=skips_pattern.txt
                       other="$IPC_CODE";     other_side=ipc ;;
              ipc)     code="$IPC_CODE";     skipfile=skips_ipc.txt
                       other="$PATTERN_CODE"; other_side=pattern ;;
            esac
            # Unset means the side never ran (fetch skipped), not a failure.
            if [ -z "$code" ] || [ "$code" = "0" ]; then
              continue
            fi
            {
              echo "Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo ""
              echo "stable: $STABLE_SC/$STABLE_SUI"
              echo "beta:   $BETA_SC/$BETA_SUI"
              echo ""
              # Say what actually happened: with both sides red nothing was
              # published, and claiming the other side shipped would hide that.
              if [ -z "$other" ]; then
                echo "The $other_side resolver never ran, so its side published nothing either."
              elif [ "$other" = "0" ]; then
                echo "Only the $side resolver is blocked; the $other_side side still published."
              else
                echo "Both resolvers failed ($side and $other_side); nothing was published."
              fi
              echo ""
              cat "$skipfile" 2>/dev/null || echo "(no FAIL lines captured)"
            } > body_$side.md
            num=$(gh issue list --state open --search "Resolver blocked: $side in:title" \
                      --json number --jq '.[0].number')
            if [ -n "$num" ]; then
              echo "resolution still blocked for $side; commenting on #$num"
              gh issue comment "$num" --body-file "body_$side.md"
            else
              gh issue create \
                --title "Resolver blocked: $side (stable $STABLE_SC, beta $BETA_SC)" \
                --body-file "body_$side.md"
            fi
          done

      - name: Close recovered issues
        if: |
          steps.fetch.outputs.skip != 'true' &&
          steps.pattern.outputs.code == '0' && steps.ipc.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two title families: the old "Pattern resolve blocked: <sha>/<sha>"
          # issues (all-or-nothing era) and the per-side "Resolver blocked"
          # ones. Close by evidence, not by title alone: every SHA named in the
          # title must have its TOMLs on disk, otherwise a half-published build
          # would close its own alarm.
          for q in "Pattern resolve blocked in:title" "Resolver blocked in:title"; do
            gh issue list --state open --search "$q" \
              --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
            while IFS="$(printf '\t')" read -r num title; do
              shas=$(printf '%s' "$title" | grep -oE '[0-9a-f]{64}' || true)
              if [ -z "$shas" ]; then
                echo "#$num has no SHA in its title; leaving it open"
                continue
              fi
              published=1
              for s in $shas; do
                if [ -f "pattern/steamclient/$s.toml" ] || [ -f "pattern/steamui/$s.toml" ]; then
                  continue
                fi
                published=0
              done
              if [ "$published" -eq 1 ]; then
                gh issue close "$num" \
                  --comment "All SHAs from this issue are published (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
              else
                echo "#$num still references unpublished SHAs; leaving it open"
              fi
            done
          done

      - name: Fail when a resolver is still blocked
        # Red run, not a green one that quietly published half a feed.
        if: |
          steps.fetch.outputs.skip != 'true' &&
          (steps.pattern.outputs.code != '0' || steps.ipc.outputs.code != '0')
        env:
          PATTERN_CODE: ${{ steps.pattern.outputs.code }}
          IPC_CODE: ${{ steps.ipc.outputs.code }}
        run: |
          echo "pattern code: $PATTERN_CODE"
          echo "ipc code:     $IPC_CODE"
          if [ "$PATTERN_CODE" = "0" ] || [ "$IPC_CODE" = "0" ]; then
            echo "The other side still published; this run is red on purpose."
          else
            echo "Both resolvers failed; nothing was published."
          fi
          exit 1
